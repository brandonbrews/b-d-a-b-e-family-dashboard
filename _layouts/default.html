<!DOCTYPE html>
<html>
<head>
    <title>{{ page.title }} | {{ site.family_name }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/assets/img/favicon.svg">
    <link rel="alternate icon" href="{{ site.baseurl }}/assets/img/favicon.svg">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

        /* ── BOTTOM NAV BAR — larger, more prominent ── */
        .nav-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 14px 48px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 4px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04) inset;
            display: flex;
            align-items: center;
            gap: 36px;
            white-space: nowrap;
        }

        .nav-logo {
            font-weight: 900;
            letter-spacing: 3px;
            color: #fff;
            text-decoration: none;
            font-size: 1.6rem;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        .nav-divider {
            width: 1px;
            height: 26px;
            background: rgba(255, 255, 255, 0.25);
        }

        .nav-links {
            display: flex;
            gap: 36px;
        }
        .nav-links a {
            color: rgba(255, 255, 255, 0.65);
            text-decoration: none;
            font-size: 1.35rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: color 0.3s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            padding: 4px 0;
        }
        .nav-links a:hover { color: #fff; }
        .nav-links a.active {
            color: #fff;
            border-bottom: 2px solid rgba(255,255,255,0.7);
            padding-bottom: 2px;
        }

        /* ── IDLE OVERLAY — shown after inactivity timeout ── */
        #idle-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0);
            z-index: 2000;
            cursor: pointer;
        }
    </style>
</head>
<body>

    {{ content }}

    <!-- Invisible overlay that catches the "wake" tap when idle redirect fires -->
    <div id="idle-overlay" onclick="cancelIdle()"></div>

    <nav class="nav-container">
        <a href="{{ site.baseurl }}/" class="nav-logo">{{ site.family_name }}</a>
        <div class="nav-divider"></div>
        <div class="nav-links">
            <a href="{{ site.baseurl }}/">Home</a>
            {% if site.show_calendar %}
            <a href="{{ site.baseurl }}/calendar">Calendar</a>
            {% endif %}
            {% if site.show_chores %}
            <a href="{{ site.baseurl }}/chores">Chores</a>
            {% endif %}
            {% if site.show_map %}
            <a href="{{ site.baseurl }}/map">Map</a>
            {% endif %}
        </div>
    </nav>

    <script>
        /* ── Active nav link highlight ── */
        (function() {
            var path  = window.location.pathname;
            var base  = '{{ site.baseurl }}';
            var links = document.querySelectorAll('.nav-links a');
            links.forEach(function(a) {
                var href      = a.getAttribute('href');
                var isHome    = href === base + '/' || href === base;
                var isCurrent = isHome
                    ? (path === base + '/' || path === base || path === base + '/index.html')
                    : path.startsWith(href);
                if (isCurrent) a.classList.add('active');
            });
        })();

        /* ── Idle redirect ─────────────────────────────────────────────────────
         * After IDLE_MINUTES of no interaction on any page except the homepage,
         * redirect to the homepage so the photo display resumes.
         * A tap anywhere cancels the countdown if it fires mid-session.
         * ─────────────────────────────────────────────────────────────────────*/
        (function() {
            var IDLE_MINUTES = 3;
            var BASE         = '{{ site.baseurl }}';
            var HOME         = BASE + '/';

            /* Don't run the idle timer on the homepage itself */
            if (window.location.pathname === HOME ||
                window.location.pathname === BASE  ||
                window.location.pathname === BASE + '/index.html') return;

            var idleTimer    = null;
            var warningTimer = null;
            var IDLE_MS      = IDLE_MINUTES * 60 * 1000;
            var WARNING_MS   = IDLE_MS - 15000; /* show warning 15s before redirect */

            function resetIdle() {
                clearTimeout(idleTimer);
                clearTimeout(warningTimer);
                document.getElementById('idle-overlay').style.display = 'none';

                warningTimer = setTimeout(function() {
                    /* Flash the nav as a subtle "going home soon" cue */
                    document.querySelector('.nav-container').style.boxShadow =
                        '0 4px 32px rgba(0,0,0,0.5), 0 0 0 2px rgba(102,252,241,0.5) inset';
                }, WARNING_MS);

                idleTimer = setTimeout(function() {
                    window.location.href = HOME;
                }, IDLE_MS);
            }

            function cancelIdle() {
                resetIdle();
                document.querySelector('.nav-container').style.boxShadow = '';
            }
            window.cancelIdle = cancelIdle;

            /* Listen for any user activity */
            ['mousedown','mousemove','keydown','touchstart','scroll','click']
                .forEach(function(ev) {
                    document.addEventListener(ev, resetIdle, { passive: true });
                });

            resetIdle(); /* start the clock */
        })();
    </script>

</body>
</html>
