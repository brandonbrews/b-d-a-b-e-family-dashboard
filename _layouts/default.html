<!DOCTYPE html>
<html>
<head>
    <title>{{ page.title }} | Horn Family</title>
    <style>
        /* Global Nav Styling */
        .nav-container {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100; /* High z-index to stay above backgrounds */
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 10px 40px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 30px;
            white-space: nowrap;
        }
        .nav-logo { font-weight: 900; letter-spacing: 2px; color: #fff; text-decoration: none; font-size: 1.2rem; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: rgba(255, 255, 255, 0.7); text-decoration: none; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; transition: 0.3s; }
        .nav-links a:hover { color: #fff; }
    </style>
</head>
<body>

    <nav class="nav-container">
        <a href="/" class="nav-logo">HORN FAMILY</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="calendar.md">Calendar</a>
            <a href="chores.md">Chores</a>
            <a href="map.md">Map</a>
            <a href="presentations.md">Presentations</a>
        </div>
    </nav>

    {{ content }}

</body>
</html>
