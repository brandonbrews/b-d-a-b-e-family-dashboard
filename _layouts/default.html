<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }} | Family Dash</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700;900&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Montserrat', sans-serif; background: #000; color: #fff; overflow: hidden; }
        .content { height: 100vh; width: 100vw; }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* Persistent Navigation */
        .family-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            border-radius: 50px; padding: 10px 30px; display: flex; gap: 25px; z-index: 1000;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .nav-item { color: white; text-decoration: none; font-weight: 700; opacity: 0.6; transition: 0.3s; }
        .nav-item:hover { opacity: 1; }
        /* Unified Navigation Bar Styling */
        .family-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            border-radius: 50px; padding: 10px 40px; 
            display: flex; justify-content: space-between; align-items: center; 
            z-index: 1000; border: 1px solid rgba(255,255,255,0.15);
            width: auto; min-width: 600px;
        }

        /* LOGO STYLING */
        .family-logo { display: flex; align-items: center; gap: 15px; margin-right: 30px; }

        /* The Initial 'H' (Icon) */
        .family-initial {
            font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 1.4rem; color: #000;
            background: #fff; border-radius: 50%;
            width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(255,255,255,0.3);
        }

        /* The 'Horn Family' Text */
        .family-name {
            font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 1.1rem; color: #fff;
            letter-spacing: 2px; text-transform: uppercase; opacity: 0.9;
        }

        /* NAV LINK STYLING */
        .nav-links { display: flex; gap: 20px; }
        .nav-item { color: white; text-decoration: none; font-weight: 700; opacity: 0.6; transition: 0.3s; }
        .nav-item:hover { opacity: 1; transform: translateY(-1px); }
    </style>
</head>
<body>
    <div class="content">
        {{ content }}
    </div>

    <!-- Updated Navigation with Refined Family Logo -->
    <nav class="family-nav">
        <!-- The Logo (Left Side of Nav) -->
        <div class="family-logo">
            <span class="family-initial">H</span> <!-- Family Initial -->
            <span class="family-name">HORN FAMILY</span> <!-- Optional Text -->
        </div>

        <!-- The Links (Right Side of Nav) -->
        <div class="nav-links">
            <a href="{{ site.baseurl }}/" class="nav-item">🏠 Home</a>
            <a href="{{ site.baseurl }}/calendar" class="nav-item">📅 Calendar</a>
            <a href="{{ site.baseurl }}/chores" class="nav-item">🧹 Chores</a>
            <a href="{{ site.baseurl }}/map" class="nav-item">🗺️ Map</a>
            <a href="{{ site.baseurl }}/presentations" class="nav-item">📊 Slides</a>
        </div>
    </nav>
</body>
</html>
