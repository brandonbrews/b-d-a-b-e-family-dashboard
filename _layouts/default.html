<!DOCTYPE html>
<html>
<head>
    <title>{{ page.title }} | {{ site.family_name }}</title>
    <style>
        /* ── RESET ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

        /* ── BOTTOM NAV BAR ── */
        .nav-container {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 10px 40px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 30px;
            white-space: nowrap;
        }

        .nav-logo {
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-decoration: none;
            font-size: 1.4rem;
            text-transform: uppercase;
        }

        .nav-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }
        .nav-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .nav-links a:hover,
        .nav-links a.active { color: #fff; }
    </style>
</head>
<body>

    {{ content }}

    <nav class="nav-container">
        <a href="{{ site.baseurl }}/" class="nav-logo">{{ site.family_name }}</a>
        <div class="nav-divider"></div>
        <div class="nav-links">
            <a href="{{ site.baseurl }}/">Home</a>
            {% if site.show_calendar %}
            <a href="{{ site.baseurl }}/calendar">Calendar</a>
            {% endif %}
            {% if site.show_chores %}
            <a href="{{ site.baseurl }}/chores">Chores</a>
            {% endif %}
            {% if site.show_map %}
            <a href="{{ site.baseurl }}/map">Map</a>
            {% endif %}
        </div>
    </nav>

    <script>
        (function() {
            var path  = window.location.pathname;
            var base  = '{{ site.baseurl }}';
            var links = document.querySelectorAll('.nav-links a');
            links.forEach(function(a) {
                var href    = a.getAttribute('href');
                var isHome  = href === base + '/' || href === base;
                var isCurrent = isHome
                    ? (path === base + '/' || path === base || path === base + '/index.html')
                    : path.startsWith(href);
                if (isCurrent) a.classList.add('active');
            });
        })();
    </script>

</body>
</html>
