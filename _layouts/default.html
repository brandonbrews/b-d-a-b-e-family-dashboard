<!DOCTYPE html>
<html>
<head>
    <title>{{ page.title }} | Horn Family</title>
    <style>
        /* Global Nav Styling */
        .nav-container {
            position: absolute;
            top: 30px;
            left: 70px;
            /* transform: translateX(-10%); */
            z-index: 100; /* High z-index to stay above backgrounds */
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 10px 40px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 30px;
            white-space: nowrap;
        }
        .nav-logo { font-weight: 900; letter-spacing: 2px; color: #fff; text-decoration: none; font-size: 48px; }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a { color: rgba(255, 255, 255, 0.7); text-decoration: none; font-size: 1.2rem; font-weight: 700; text-transform: uppercase; transition: 0.3s; }
        .nav-links a:hover { color: #fff; }
        baseurl: "/b-d-a-b-e-family-dashboard"
    </style>
</head>
<body>

    <nav class="nav-container">
    <a href="/b-d-a-b-e-family-dashboard/" class="nav-logo">HORN FAMILY</a>
    <div class="nav-links">
        <a href="/b-d-a-b-e-family-dashboard/">Home</a>
        <a href="/b-d-a-b-e-family-dashboard/calendar">Calendar</a>
        <a href="/b-d-a-b-e-family-dashboard/chores">Chores</a>
        <a href="/b-d-a-b-e-family-dashboard/map">Map</a>
        <a href="/b-d-a-b-e-family-dashboard/presentations">Presentations</a>
    </div>
</nav>

    {{ content }}

</body>
</html>
